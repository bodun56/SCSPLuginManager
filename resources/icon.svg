<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4a73"/>
      <stop offset="1" stop-color="#0d1c2e"/>
    </linearGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8d8ea"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee787"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Фон: тёмно-синий скруглённый квадрат -->
  <rect x="6" y="6" width="244" height="244" rx="54" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="54" fill="none"
        stroke="#4a7ab5" stroke-width="1.5" opacity="0.55"/>

  <!-- Пазл: белая деталь с двумя выступами -->
  <g filter="url(#shadow)">
    <path d="M 72 85
             L 108 85
             A 14 14 0 0 0 136 85
             L 172 85
             L 172 121
             A 14 14 0 0 1 172 149
             L 172 185
             L 72 185
             Z"
          fill="url(#piece)"/>
  </g>

  <!-- Зелёная галочка: «плагин включён» -->
  <path d="M 105 138 L 118 151 L 142 125"
        fill="none" stroke="url(#check)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>